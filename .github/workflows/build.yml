name: Docker Build

on:
  pull_request:
    branches:
      - develop
      - release/*
  push:
    branches:
      - develop
      - release/*

permissions:
  contents: read
  security-events: write

jobs:
  build-api:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ secrets.IMAGE }}/api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ./CSETWebApi
          file: ./CSETWebApi/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API image for vulnerabilities
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.IMAGE }}/api:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-api-image-results.sarif

      - name: Upload image scan results
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: trivy-api-image-results.sarif
          category: api-image

  build-web:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ secrets.IMAGE }}/web
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ./CSETWebNg
          file: ./CSETWebNg/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dependabot-build:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      - name: Basic build test (API)
        working-directory: ./CSETWebApi
        run: docker build -f Dockerfile . --tag test-api:latest

      - name: Basic build test (Web)
        working-directory: ./CSETWebNg
        run: docker build -f Dockerfile . --tag test-web:latest
