name: Trivy Scanner

on:
  pull_request:
  push:
    branches:
      - develop
  schedule:
    - cron: "0 21 * * 0"

permissions:
  contents: read
  security-events: write

jobs:
  dotnet:
    name: .NET Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: dotnet restore
        run: dotnet restore CSETWebApi/CSETWeb_Api/CSETWeb_Api.sln

      - name: dotnet backend
        run: dotnet build CSETWebApi/CSETWeb_Api/CSETWeb_Api.sln -c Release --no-restore

      - name: Run vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          format: sarif
          output: trivy-dotnet-results.sarif
          scan-type: fs
          scan-ref: ./CSETWebApi
          scanners: vuln
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: 'trivy-dotnet-results.sarif'
          category: dotnet

  nodejs:
    name: Node.js Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          format: sarif
          output: trivy-nodejs-results.sarif
          scan-type: fs
          scan-ref: ./CSETWebNg
          scanners: vuln
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: 'trivy-nodejs-results.sarif'
          category: nodejs
