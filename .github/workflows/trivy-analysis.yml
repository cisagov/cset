name: Trivy Scanner

on:
  pull_request:
  push:
    branches:
      - develop
  schedule:
    - cron: "0 21 * * 0"

permissions:
  contents: read
  security-events: write

jobs:
  dotnet:
    name: .NET Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: dotnet restore
        run: dotnet restore CSETWebApi/CSETWeb_Api/CSETWeb_Api.sln

      - name: dotnet backend
        run: dotnet build CSETWebApi/CSETWeb_Api/CSETWeb_Api.sln -c Release --no-restore

      - name: Run vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          format: sarif
          output: trivy-dotnet-results.sarif
          scan-type: fs
          scan-ref: ./CSETWebApi
          scanners: vuln
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-dotnet-results.sarif'
          category: dotnet

  nodejs:
    name: Node.js Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          format: sarif
          output: trivy-nodejs-results.sarif
          scan-type: fs
          scan-ref: ./CSETWebNg
          scanners: vuln
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-nodejs-results.sarif'
          category: nodejs
