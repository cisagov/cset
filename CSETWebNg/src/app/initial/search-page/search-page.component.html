<div *transloco="let t" class="mx-4 mt-4">
  <h4>{{t('titles.search results')}}</h4>
  <div *ngIf="galleryItemsTmp.length == 0">
    {{t('no search results')}}
  </div>
  <div class="tw:grid tw:grid-cols-1 tw:sm:grid-cols-2 tw:lg:grid-cols-3 tw:xl:grid-cols-4 tw:gap-6">
    <div *ngFor="let c of galleryItemsTmp; let i = index">
      <div [attr.id]="'c'+c.item.gallery_Item_Guid" class="card gallery-card"
        (mouseover)="onHover(c.item.gallery_Item_Guid)" (mouseleave)="onHoverOut(-1, c.item.gallery_Item_Guid)"
        style="width: 290px;">

        <div class="card-body gallery-card-body tw:cursor-pointer"
          style="min-height:150px; max-height:150px;" (click)="navSvc.beginNewAssessmentGallery(c.item)">
          <div class="img-container">
            <img class="img-cropped-calc" [src]="getImageSrc(c.item.icon_File_Name_Small)">
          </div>
          <h6 class="card-title tw:max-h-20 tw:min-h-20 tw:font-bold tw:text-sm" ellipsis [ellipsis-content]="c.item.title"
            style="max-height:80px; min-height:80px; font-weight:bold;"></h6>
        </div>

        <div class="card-footer" [class.gallery-card-footer]="c.item.gallery_Item_Guid==hoverIndex"
          style="text-align:right;">
          <button *ngIf="c.item.isFavorite && c.item.gallery_Item_Guid!=hoverIndex"
                  [matTooltip]="t('tooltip.remove favorite')"
                  class="btn btn-circle tw:bg-white tw:border-2 tw:border-gray-300 hover:tw:bg-gray-100 gallery-btn-favorite"
                  (click)="toggleFavorite($event, c)"
                  style="margin-right:5px;">
            <i class="fa-solid fa-star tw:scale-125 tw:inline-block tw:text-yellow-400"
               style="text-shadow: 0 0 3px currentColor"></i>
          </button>
          <button *ngIf="c.item.isFavorite && c.item.gallery_Item_Guid==hoverIndex"
                  [matTooltip]="t('tooltip.remove favorite')"
                  class="btn btn-circle tw:bg-white tw:border-2 tw:border-white gallery-btn-favorite"
                  (click)="toggleFavorite($event, c)"
                  style="margin-right:5px;">
            <i class="fa-solid fa-star tw:scale-125 tw:inline-block tw:text-yellow-400"
               style="text-shadow: 0 0 3px currentColor"></i>
          </button>
          <button *ngIf="!c.item.isFavorite && c.item.gallery_Item_Guid==hoverIndex"
                  [matTooltip]="t('tooltip.add favorite')"
                  class="btn btn-outline-light btn-circle gallery-btn-favorite"
                  (click)="toggleFavorite($event, c.item)"
                  style="margin-right:5px;">
            <i class="fa-solid fa-star tw:scale-125 tw:inline-block tw:text-yellow-400"
               style="text-shadow: 0 0 3px currentColor"></i>
          </button>
          <button class="btn btn-outline-light btn-circle gallery-btn-info" (click)="openDialog(c.item)"
            [hidden]="c.item.gallery_Item_Guid!=hoverIndex" style="margin-right:5px; z-index:100"><i
              class="fa-solid fa-info tw:scale-125 tw:inline-blocko">
          </i>
          </button>
          <button class="btn btn-outline-light btn-circle gallery-btn-play"
            (click)="navSvc.beginNewAssessmentGallery(c.item)" [hidden]="c.item.gallery_Item_Guid!=hoverIndex"><i
              class="fa-solid fa-play tw:inline-block"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>
