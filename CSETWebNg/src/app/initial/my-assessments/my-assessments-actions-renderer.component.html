<div *transloco="let t" class="tw:flex tw:h-full tw:gap-0">
  <button class="btn hover:btn-error tw:px-2"
    data-action="delete"
    [attr.data-assessment-id]="assessment.assessmentId"
    [attr.data-row-index]="params.rowIndex"
    [matTooltip]="t('tooltip.remove assessment icon')">
    <span class="cset-icons-trash-x"></span>
  </button>

  <button *ngIf="params.showExport"
    class="btn btn-ghost tw:px-2"
    data-action="export"
    [attr.data-assessment-id]="assessment.assessmentId"
    [matTooltip]="t('tooltip.export assessment csetw icon')">
    <span class="cset-icons-export-up"></span>
  </button>

  <button *ngIf="params.showExportJson"
    class="btn btn-ghost tw:px-2"
    data-action="exportJson"
    [attr.data-assessment-id]="assessment.assessmentId"
    [matTooltip]="t('tooltip.export assessment json icon')">
    <img class="tw:relative tw:w-[23px] tw:min-w-[23px] tw:shrink-0"
      src="assets/images/icons/export-json.svg"
      alt="">
  </button>

  <div *ngIf="params.showExportJson"
    class="tw:flex tw:items-center tw:border-l tw:border-base-300 tw:ps-2"
    [matTooltip]="t('tooltip.mark as submitted to cisa')">
    <input type="checkbox"
      [id]="'json-uploaded-' + assessment.assessmentId"
      [checked]="assessment.jsonUploaded"
      class="checkbox-custom tw:sr-only"
      data-action="toggleJsonUploaded"
      [attr.data-assessment-id]="assessment.assessmentId">
    <label [for]="'json-uploaded-' + assessment.assessmentId"
      class="checkbox-custom-label tw:my-0 tw:items-center">
      CISA
    </label>
  </div>
</div>
