<div style="line-height: 150%;" class="me-4 text-start" *transloco="let t">
    <div>{{assessDetail?.assessmentName}}</div>
    <div>
        {{assessDetail?.assessmentDate | localizeDate}}
    </div>
    <div>
        {{assessDetail?.facilityName}}
    </div>
    <div>
        {{assessDetail?.creatorName}}
    </div>
    <div *ngIf="assessDetail?.selfAssessment" class="self-assess">
        {{ t('reports.self assessment indicator') | uppercase }}
    </div>
</div>
