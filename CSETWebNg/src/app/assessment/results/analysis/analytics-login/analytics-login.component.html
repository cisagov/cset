<div class="d-flex flex-column justify-content-center flex-11a" (keydown.enter)="submit()">
  <div class="mat-dialog-header p-3 d-flex justify-content-start align-items-center flex-00a">
    <span class="cset-icons-key-shield fs-base-6 me-3"></span>
    <span>Login to Data Submission</span>
  </div>
  <mat-dialog-content class="p-3 oy-auto d-flex flex-column flex-11a">

    <div class="container">
      <form [formGroup]="dataloginForm">
        <div class="mb-4">
          <p>
            Enter your account credentials for the CSET Enterprise server.
          </p>
          <p>
            If you do not have an account, use the browser interface to create a new account.
          </p>
        </div>
        <p>
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Username</mat-label>
            <input type="text" trim="blur" matInput placeholder="Username" formControlName="username"
              [errorStateMatcher]="matcherusername">
            <mat-icon matPrefix style="margin-right:10px;">face</mat-icon>
            <mat-error *ngIf="dataloginForm.controls.username.hasError('required')">
              Username is <strong>required</strong>
            </mat-error>
          </mat-form-field>
        </p>

        <p>
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Password</mat-label>
            <input [type]="hidePassword ? 'password' : 'text'" trim="blur" matInput placeholder="Password"
              formControlName="password" [errorStateMatcher]="matcherpassword">
            <mat-icon matPrefix style="margin-right: 10px;">lock</mat-icon>
            <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" class="" type="button"
              style="margin-right: 15px; padding: 0; width: 24px; height: 24px; vertical-align: middle;">
              <mat-icon class="">{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
            <mat-error *ngIf="dataloginForm.controls.password.hasError('required')">
              Password is <strong>required</strong>
            </mat-error>
          </mat-form-field>
        </p>
        <p *ngIf="error" class="alert alert-danger">
          {{ error }}
        </p>
      </form>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions class="p-3 pt-0 mb-0">
    <div class="d-flex flex-row w-100" style="justify-content: space-between">
      <div class="d-flex flex-row">
        <button class="btn btn-default" (click)="close()">Cancel</button>&nbsp;
        <button class="btn btn-primary d-flex flex-row" (click)="submit()">Login and Sync
          <div *ngIf="uploadInProgress"
            class="spinner-container white p-0 m-0 ms-3 d-flex justify-content-center align-items-center flex-11a">
            <div class="spinner-size-20"></div>
          </div>
        </button>
      </div>
    </div>
  </mat-dialog-actions>
</div>
