<div>
  <div class="white-panel oy-auto ox-auto d-flex flex-column flex-11a" *transloco="let t">
    <p>{{t('analytics.description 1')}}</p>
    <p>{{t('analytics.description 2')}}</p>

    <div class="container ps-0">
      <div class="container-fluid ps-0">
        <div class="row">
          <div class="col-sm ps-0">
            <mat-card class="p-3 pt-0" style="background-color: transparent; box-shadow: none">

              <div class="p-4">
                <label>Comparison Group</label>
                <select class="form-select" (change)="onChangeSectorSelection($event)">
                  <option *ngFor="let s of mySectors" [value]="s.sectorId">{{s.sectorName}} - sample size:
                    {{s.sampleCount}}</option>
                </select>
              </div>

              <table class="legend-table mt-2 mb-4 ms-4 p-2" style="border: 1px solid #ddd; width: 50%">
                <tr>
                  <td>
                    <svg height="10" width="22">
                      <rect x="0" y="0" width="22" height="10" [attr.fill]="rangeBarFill"></rect>
                    </svg>
                  </td>
                  <td><span style="font-size: .8rem">{{t('analytics.score range')}}</span></td>
                </tr>
                <tr>
                  <td>
                    <svg width="12" height="12">
                      <circle cy="6" cx="6" r="5" [attr.fill]="dotFill" [attr.stroke]="dotStroke" />
                    </svg>
                  </td>
                  <td><span style="font-size: .8rem">{{t('analytics.current score')}}</span></td>
                </tr>
                <tr>
                  <td>
                    <span>|</span>
                  </td>
                  <td><span style="font-size: .8rem">{{t('analytics.vertical bar')}}</span></td>
                </tr>

              </table>


              <div *ngIf="!scoreBarData">
                <div class="spinner-container" style="margin: 2em auto">
                  <div style="max-width: 50px; max-height: 50px;"></div>
                </div>
              </div>

              <app-score-ranges *ngIf="!!scoreBarData" [chartWidth]="600" [data]="scoreBarData" [dotFill]="dotFill"
                [dotStroke]="dotStroke"></app-score-ranges>

            </mat-card>

          </div>
        </div>
      </div>
    </div>
  </div>
  <app-nav-back-next [page]="'analytics-results-page'"></app-nav-back-next>
</div>
