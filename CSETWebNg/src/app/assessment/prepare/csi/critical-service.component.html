<ng-container *transloco="let t">
  <div class="white-panel d-flex flex-column justify-content-start flex-11a">

    <div class="mb-4">
      <label class="form-label" for="criticalService">{{t('critical service name')}}</label>
      <input [ngClass]="{ 'is-invalid' : !demographics.criticalService }" class="form-control" autocomplete="off"
        tabindex="0" maxlength="100" name="criticalService" id="criticalService"
        [(ngModel)]="demographics.criticalService" placeholder="{{t('critical service name')}}"
        (blur)="updateDemographics()" />
    </div>

    <div class="mb-3">
      <label for="criticalServiceDescription" class="form-label">{{t('critical service description')}}</label>
      <input [ngClass]="{
          'is-invalid': !demographics.criticalServiceDescription && showErrors()
        }" class="form-control" tabindex="0" type="text" maxlength="150" name="criticalServiceDescription"
        id="criticalServiceDescription" [(ngModel)]="demographics.criticalServiceDescription"
        placeholder="{{t('critical service description')}}" (change)="updateDemographics()" />
    </div>

    <div class="mb-4">
      <label class="form-label" for="critSvcPointOfContact">Critical Service Point of
        Contact</label>
      <select class="form-select" id="critSvcPointOfContact" tabindex="0" name="critSvcPointOfContact"
        (change)="updateDemographics()" [(ngModel)]="demographics.pointOfContact">
        <option [ngValue]="null">-- {{t('select')}} --</option>
        <option *ngFor="let contact of contacts" [ngValue]="contact.assessmentContactId">
          {{ contact.firstName }} {{ contact.lastName }}
        </option>
      </select>
    </div>

    <!-- #6 -->
    <div class="mb-4">
      <label for="disruptedSectors" class="form-label">
        Please select in order of criticality, the two critical infrastructure
        sectors which, if they were unavailable
        or disrupted for one week or more, would most affect your ability to
        sustain the critical service.
      </label>

      <div class="ms-4">
        <label class="form-label">Most important</label>
        <select [ngClass]="{ 'is-invalid' : !iodDemographics.disruptedSector1 }" class="form-select mb-3"
          name="disruptedSector1" tabindex="0" [(ngModel)]="iodDemographics.disruptedSector1"
          (change)="updateDemographics()">
          <option [ngValue]="null">-- {{t('select')}} --</option>
          <option *ngFor="let i of iodDemographics.listSectors" [ngValue]="i.optionValue"
            [selected]="i.optionValue === iodDemographics.disruptedSector1">
            {{ i.optionText }}
          </option>
        </select>

        <label class="form-label">Second most important</label>
        <select [ngClass]="{ 'is-invalid' : !iodDemographics.disruptedSector2 }" class="form-select mb-3"
          name="disruptedSector2" tabindex="0" [(ngModel)]="iodDemographics.disruptedSector2"
          (change)="updateDemographics()">
          <option [ngValue]="null">-- {{t('select')}} --</option>
          <option *ngFor="let i of iodDemographics.listSectors" [ngValue]="i.optionValue"
            [selected]="i.optionValue === iodDemographics.disruptedSector2">
            {{ i.optionText }}
          </option>
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label me-2" for="multisiteService">Multi-site Service?</label>
      <input type="checkbox" name="multisiteService" id="multisiteService" class="tw:toggle"
        [(ngModel)]="csiServiceDemographic.multiSite"
        (ngModelChange)="csiServiceDemographic.multiSiteDescription = null; updateServiceComp()">

      <input class="form-control" tabindex="0" maxlength="150" name="multiSiteDescription" type="text"
        placeholder="Multi-site Service Description" [(ngModel)]="csiServiceDemographic.multiSiteDescription"
        (change)="updateServiceComp()" [disabled]="!csiServiceDemographic.multiSite" />
    </div>

  </div>

  <app-nav-back-next [page]="aliasId"></app-nav-back-next>

</ng-container>
