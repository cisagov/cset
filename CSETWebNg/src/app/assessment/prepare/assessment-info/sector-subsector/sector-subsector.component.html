<div *transloco="let t">
     <div *ngFor="let ssPair of sectorList; let i = index" class="mb-3 sector-item">
          <div class="sector-group position-relative mb-4">
               <div class="row">

                    <div class="col">
                         <label for="sector-{{i}}" class="form-label">{{ t('sector') }}</label>
                         <select [ngClass]="{ 'is-invalid' : !ssPair.sectorId}" class="form-select" id="sector-{{i}}"
                              tabindex="0" name="sector-{{i}}" [(ngModel)]="ssPair.sectorId"
                              (ngModelChange)="onChangeSector($event, ssPair)">
                              <option [ngValue]="null">-- {{ t('select') }} --</option>
                              <option *ngFor="let item of demographicData.listSectors" [ngValue]="item.optionValue"
                                   [selected]="item.optionValue === ssPair?.sectorId">
                                   {{ item.optionText }}
                              </option>
                         </select>
                    </div>

                    <div class="col">
                         <label for="subsector-{{i}}" class="form-label">{{ t('subsector') }}</label>
                         <div class="row">
                              <div [class]="(sectorList.length > 1) ? 'col-11' : 'col-12'">
                                   <select [ngClass]="{ 'is-invalid' : !ssPair.subsectorId }" class="form-select"
                                        id="subsector-{{i}}" tabindex="0" name="subsector-{{i}}"
                                        [(ngModel)]="ssPair.subsectorId"
                                        (ngModelChange)="onChangeSector($event, ssPair)">
                                        <option [ngValue]="null">-- {{ t('select') }} --</option>
                                        <option *ngFor="let item of ssPair.subsectorList" [ngValue]="item.optionValue"
                                             [selected]="item.optionValue === ssPair?.subsectorId">
                                             {{ item.optionText }}
                                        </option>
                                   </select>
                              </div>

                              <button *ngIf="i > 0" class="btn remove-btn col-1"
                                   [matTooltip]="t('tooltip.remove sector')" (click)="onRemoveSector($event, ssPair)"
                                   type="button">
                                   <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 27 35"
                                        class="icon-color">
                                        <path fill="currentColor"
                                             d="M25.39,1.892L17.679,1.892 17.679,1.702C17.679,0.762,16.902,0,15.943,0L11.058,0C10.099,0,9.321,0.762,9.321,1.702L9.321,1.892 1.61,1.892C0.691,1.892,0,2.701,0,3.603L0,5.675 27,5.675 27,3.603C27,2.701,26.309,1.892,25.39,1.892 M21.857,10.405L17.679,10.405 17.679,31.531 21.857,31.531z M15.429,10.405L11.25,10.405 11.25,31.531 15.429,31.531z M9,10.405L4.821,10.405 4.821,31.531 9,31.531z M25.705,7.568L24.429,33.297C24.429,34.237,23.652,35,22.693,35L4.308,35C3.349,35,2.571,34.237,2.571,33.297L1.296,7.568z">
                                        </path>
                                   </svg>
                              </button>
                         </div>
                    </div>
               </div>
          </div>
     </div>

     <div *ngIf="multi">
          <button class="btn btn-primary btn-add-sector" (click)="onAddSector()" type="button">
               <span class="cset-icons-plus fs-base me-2"></span>
               {{ t('buttons.add sector') }}
          </button>
     </div>

</div>
